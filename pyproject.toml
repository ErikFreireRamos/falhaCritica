[project]
name = "critical-failure"
version = "0.1.0"
description = "Simulador de partidas do jogo de cartas Critical Failure (TCC, UFPB)"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Erik Freire Ramos", email = "erik.freire.ramos@gmail.com" }]
dependencies = [
    "numpy>=2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
cf = "critical_failure.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/critical_failure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "regra(*ids): identificadores da especificação que o teste cobre (R-..., V1-...)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.mutmut]
# Teste de mutação (Fase 5): roda no GitHub Actions (.github/workflows/mutacao.yml), não no Windows.
# Muta só o motor. Ficam de fora os testes lentos (experimentos, variantes, metamórficos e fuzzing)
# e os de convenção, que leem o código-fonte e não fazem sentido sobre o código mutado.
paths_to_mutate = ["src/critical_failure/regras/v2/", "src/critical_failure/regras/v1/"]
tests_dir = ["tests/"]
also_copy = ["configs/", "regras/", "docs/", "scripts/", "experimentos/"]
pytest_add_cli_args = [
    "--ignore=tests/test_experimentos.py",
    "--ignore=tests/test_variantes.py",
    "--ignore=tests/test_metamorficos.py",
    "--ignore=tests/test_fuzzing.py",
    "--ignore=tests/test_convencoes.py",
]
