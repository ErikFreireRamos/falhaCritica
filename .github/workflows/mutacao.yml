# Teste de mutação (Fase 5, autor em 2026-11-11): sob demanda, no Linux (o mutmut não roda no
# Windows nativo). Muta o motor (regras/v2 e regras/v1, configurado em pyproject.toml) e roda os
# testes de regra, de propriedades, de variantes e os registros de referência contra cada mutante.
# Para rodar, abra a aba Actions do repositório, escolha "Teste de mutação" e clique em "Run workflow".
#
# Os cerca de 4.900 mutantes rodam em partes, em paralelo (.github/mutacao_partes.txt), e o job
# "juntar" soma o resultado no artefato "resultado-da-mutacao" e no resumo da execução. Cada parte tem
# o seu runner: se um mutante derrubar o runner, só aquela parte se perde. Cada processo do mutmut tem
# um limite de memória, para um mutante que entra em laço morrer com MemoryError (conta como morto) em
# vez de esgotar a memória do runner, como na execução de 2026-11-11, que caiu no mutante 2.045. Cada
# parte também escreve o seu resultado no resumo da execução, que não depende do serviço de artefatos.
#
# O campo "mutantes" aceita nomes ou padrões do mutmut, separados por espaço (por exemplo,
# "critical_failure.regras.v1*"), e roda só eles, numa parte só; vazio, roda todas as partes.
name: Teste de mutação

on:
  workflow_dispatch:
    inputs:
      mutantes:
        description: "Mutantes a rodar, numa parte só (vazio: todos, nas partes de .github/mutacao_partes.txt)"
        required: false
        default: ""

jobs:
  planejar:
    runs-on: ubuntu-latest
    outputs:
      partes: ${{ steps.partes.outputs.partes }}
    steps:
      - uses: actions/checkout@v4
      - id: partes
        env:
          MUTANTES: ${{ inputs.mutantes }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'FIM'
          import json, os
          pedido = os.environ["MUTANTES"].strip()
          if pedido:
              partes = [pedido]
          else:
              with open(".github/mutacao_partes.txt", encoding="utf-8") as arquivo:
                  partes = [linha.strip() for linha in arquivo if linha.strip() and not linha.startswith("#")]
          print("partes=" + json.dumps(partes, ensure_ascii=False))
          FIM

  mutacao:
    name: mutação (parte ${{ strategy.job-index }})
    needs: planejar
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        parte: ${{ fromJSON(needs.planejar.outputs.partes) }}
    env:
      # Menos memória reservada por processo; não muda nenhum resultado.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências
        run: uv sync --locked
      - name: Rodar o mutmut
        # Limite do passo abaixo do limite do job: se o tempo acabar, o resumo e o artefato saem
        # mesmo assim, com os mutantes já avaliados.
        timeout-minutes: 330
        env:
          PARTE: ${{ matrix.parte }}
        run: |
          set -f  # os padrões têm * e não podem virar nomes de arquivo
          echo "memória: $(free -m | awk '/Mem:/ {print $2}') MB; processadores: $(nproc)"
          ulimit -v 4194304  # 4 GB de memória virtual por processo (o principal e os 2 filhos)
          uv run --with mutmut==3.8.1 mutmut run --max-children 2 $PARTE
      - name: Resumo
        if: always()
        env:
          PARTE: ${{ matrix.parte }}
          INDICE: ${{ strategy.job-index }}
        run: |
          uv run --with mutmut==3.8.1 mutmut results 2>&1 | grep -v ': not checked' > mutacao.txt || true
          uv run --with mutmut==3.8.1 mutmut export-cicd-stats > /dev/null 2>&1 || true
          tail -n 40 mutacao.txt || true
          cat mutants/mutmut-cicd-stats.json || true
          # O resultado também vai para o resumo da execução, que não depende do serviço de artefatos.
          {
            echo "### Parte $INDICE"
            echo
            echo "Padrões: \`$PARTE\`"
            echo
            echo '```'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo "sem estatísticas"
            echo '```'
            echo
            echo "<details><summary>Mutantes não mortos</summary>"
            echo
            echo '```'
            cat mutacao.txt 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # O serviço de artefatos do GitHub às vezes responde com uma página de erro (2026-11-14: 5 das 9
      # partes). O envio não derruba a parte e é tentado de novo depois de 2 minutos; o resultado já
      # está no resumo da execução.
      - name: Enviar o resultado
        id: enviar
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: resultado-da-mutacao-${{ strategy.job-index }}
          overwrite: true
          path: |
            mutacao.txt
            mutants/mutmut-cicd-stats.json
      - name: Esperar antes de enviar de novo
        if: always() && steps.enviar.outcome == 'failure'
        run: sleep 120
      - name: Enviar o resultado (segunda tentativa)
        if: always() && steps.enviar.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: resultado-da-mutacao-${{ strategy.job-index }}
          overwrite: true
          path: |
            mutacao.txt
            mutants/mutmut-cicd-stats.json

  juntar:
    needs: [planejar, mutacao]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: resultado-da-mutacao-*
          path: partes
      - name: Somar as partes
        env:
          PARTES: ${{ needs.planejar.outputs.partes }}
        run: |
          python3 - <<'FIM'
          import json, os, pathlib
          esperadas = len(json.loads(os.environ["PARTES"]))
          campos = ["killed", "survived", "timeout", "no_tests", "suspicious", "segfault", "skipped",
                    "check_was_interrupted_by_user"]
          soma = dict.fromkeys(campos, 0)
          sem_resultado, linhas = [], []
          for indice in range(esperadas):
              pasta = pathlib.Path("partes") / f"resultado-da-mutacao-{indice}"
              estatisticas = pasta / "mutants" / "mutmut-cicd-stats.json"
              if not estatisticas.exists():
                  sem_resultado.append(str(indice))
                  continue
              dados = json.loads(estatisticas.read_text(encoding="utf-8"))
              for campo in campos:
                  soma[campo] += dados.get(campo, 0)
              resultados = pasta / "mutacao.txt"
              if resultados.exists():
                  texto = resultados.read_text(encoding="utf-8", errors="replace")
                  linhas += [linha for linha in texto.splitlines() if linha.strip()]
          decididos = soma["killed"] + soma["survived"]
          resumo = [f"{campo}: {valor}" for campo, valor in soma.items()]
          resumo.append(f"avaliados: {sum(soma.values())}")
          if decididos:
              resumo.append(f"escore (mortos / (mortos + sobreviventes)): {soma['killed'] / decididos:.3f}")
          resumo.append(f"partes com resultado: {esperadas - len(sem_resultado)} de {esperadas}")
          if sem_resultado:
              resumo.append(
                  f"partes sem resultado: {', '.join(sem_resultado)} (os números delas estão no resumo de cada "
                  "parte, na página da execução)"
              )
          texto = "\n".join(resumo + ["", "Mutantes não mortos:"] + linhas) + "\n"
          pathlib.Path("mutacao-total.txt").write_text(texto, encoding="utf-8")
          print("\n".join(resumo))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as saida:
              saida.write("### Soma das partes\n\n```\n" + "\n".join(resumo) + "\n```\n")
          FIM
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: resultado-da-mutacao
          overwrite: true
          path: mutacao-total.txt
