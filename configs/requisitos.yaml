# Requisitos de balanceamento do Critical Failure
#
# Cada requisito tem a definição exata da métrica e uma zona de aceite.
# As zonas são fixadas ANTES de rodar o experimento que as mede.
#
# Veredito de cada requisito, a partir do intervalo de confiança da métrica:
#   passa        o intervalo inteiro está dentro da zona
#   falha        o intervalo inteiro está fora da zona
#   inconclusivo o intervalo cruza a borda da zona
#
# tipo:
#   regra          propriedade das regras, medida com bots idênticos
#   comportamento  depende de como os bots jogam; é relatado como faixa sobre
#                  várias populações de bots e no equilíbrio empírico
#   modelo         depende de uma hipótese do simulador (MOD-xx)
#   simulador      qualidade do próprio simulador
#
# estado:
#   aguardando_decisao  métrica e zona são sugestão do assistente
#   confirmado          o autor confirmou (data em docs/DIARIO_DE_BORDO.md)
#
# Todas as zonas abaixo são sugestões. Nenhuma vale antes da confirmação do autor.
#
# Decisão do autor em 2026-11-09: cada zona é confirmada na fase em que o
# requisito é medido pela primeira vez, sempre antes de rodar o experimento.

esquema: cf-requisitos/1
nivel_de_confianca: 0.95
intervalos:
  proporcao: wilson
  demais: bootstrap

requisitos:
  - id: REQ-01
    nome: Equidade de assento
    tipo: regra
    fonte: "prompt 3.6"
    metrica: >
      Taxa de vitória por posição na ordem inicial (posição 0 é o primeiro
      jogador do ciclo 1), com o mesmo bot em todos os assentos, para cada
      número de jogadores N. Empates contam como vitória dividida (AMB-14).
    zona: "cada posição entre 1/N - 0.02 e 1/N + 0.02"
    criterio: {margem: 0.02}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-02
    nome: Anti bola de neve
    tipo: regra
    fonte: "prompt 3.6"
    metrica: >
      Vantagem do líder = P(vencer | líder isolado no ponto de corte) - 1/N.
      Ponto de corte na v2.2: fim da Produção do ciclo 1, líder em fichas.
      Ponto de corte na v1, que não tem ciclos: depois que cada jogador fez o
      primeiro dos seus 3 testes, líder em cartas no sistema.
      Mesmos estilos de bot e mesmas sementes nas duas versões. A v1 só é
      observada, nunca ajustada (autor, 2026-11-10).
    zona: "vantagem do líder na v2.2.1 menor que na v1 por pelo menos 0.05"
    criterio: {margem: 0.05}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-03
    nome: Habilidade importa
    tipo: comportamento
    fonte: "prompt 3.6"
    metrica: >
      Taxa de vitória de 1 bot Heurístico (o foco) numa mesa com N-1 bots
      Aleatórios, com o mesmo perfil de conhecimento para todos, com rodízio de
      assentos. Só o piso tem critério (autor, 2026-11-10): o Aleatório quase
      nunca vence na v2.2.1, então um teto diria mais sobre ele do que sobre o
      jogo. A parte "sem ganhar sempre" fica para quando houver um adversário
      mais fraco que jogue de verdade.
    zona: "acima de 1.5/N"
    criterio: {fator_minimo: 1.5}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-04
    nome: Sem estratégia dominante
    tipo: comportamento
    fonte: "prompt 3.6; PDF 2.2 p. 34 (Contestação)"
    metrica: >
      Matriz de ganhos: taxa de vitória de 1 jogador do perfil i (o foco) numa
      mesa em que os outros N-1 são do perfil j, com rodízio de assentos. Vale
      para a matriz de estilos (MET-07) e para a de perfis puros de blefe. Na
      mesa do próprio perfil, o foco vence exatamente 1/N. Um perfil é
      dominante se é a melhor resposta contra todas as mesas, inclusive a do
      próprio perfil: em cada coluna, a diferença para cada outro perfil tem o
      intervalo de confiança inteiro acima da diferença mínima. Passa se nenhum
      perfil é dominante; falha se algum é; inconclusivo se algum não pode ser
      nem afirmado nem descartado. Complemento sem veredito: a dinâmica do
      replicador sobre a matriz, numa aproximação linear. Redação corrigida
      pelo autor em 2026-11-10: a anterior ("acima de 1/N + 0.02 contra todas
      as mesas, inclusive a do próprio perfil") nunca acusaria dominância.
    zona: "nenhum perfil dominante"
    criterio: {diferenca_minima: 0.0}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-05
    nome: Blefes bem-sucedidos
    tipo: comportamento
    fonte: "prompt 3.6; PDF 2.2 p. 34 (Contestação)"
    metrica: >
      Blefes bem-sucedidos divididos por blefes tentados, somados sobre as
      partidas (bootstrap sobre as partidas). Blefe tentado é a defesa que
      nomeia um teste que não está no sistema (AMB-15). É bem-sucedido quando
      termina sem Alerta: a explicação conferiu e o atacante aceitou. O
      veredito vale no equilíbrio da dinâmica do replicador do torneio entre
      os perfis puros de blefe (autor, 2026-11-10): se ela termina num perfil
      só, vale a mesa de perfis iguais dele; se termina numa mistura, vale uma
      mesa sorteada da mistura, rodada depois. As populações de perfis iguais
      aparecem como faixa, só como descrição.
    zona: "entre 0.30 e 0.50"
    criterio: {minimo: 0.30, maximo: 0.50}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-06
    nome: Distribuição de ataques
    tipo: comportamento
    fonte: "prompt 3.6; PDF 2.2 p. 34 (Alvo livre)"
    metrica: >
      (a) Por partida, razão entre o máximo e a média de testes recebidos por
      jogador. (b) Fração dos testes dirigida a quem tem o menor placar no
      momento do teste, comparada com a chance uniforme 1/(N-1).
    zona: "(a) média da razão até 1.5; (b) fração até 1/(N-1) + 0.10"
    criterio: {razao_maxima: 1.5, acima_do_uniforme: 0.10}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-07
    nome: Fichas não zeram cedo
    tipo: regra
    fonte: "prompt 3.6; PDF 2.2 p. 34 (Fichas iniciais)"
    metrica: >
      Fração de partidas em que algum jogador fica com 0 fichas em qualquer
      momento antes do início do ciclo 3.
    zona: "até 0.10"
    criterio: {maximo: 0.10}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-08
    nome: Duração
    tipo: modelo
    fonte: "prompt 3.6; PDF 2.2 p. 34 e 35 (Compra por Planejamento; Duração)"
    metrica: >
      Mediana da duração estimada da partida pelo modelo de tempos por ação
      (MOD-05), para N = 4 e 5 (o PDF pede 4 a 6; o máximo passou a 5 pela
      COR-01). Os tempos por ação estão em configs/duracao.yaml e são
      provisórios. A fração de partidas acima de 60 minutos é relatada como
      descrição (percentil 90), sem critério, até o autor decidir.
    zona: "mediana entre 40 e 50 minutos em cada N"
    criterio: {minimo: 40, maximo: 50}
    estado: confirmado  # autor, 2026-11-10: zona do PDF (p. 35) e tempos provisórios de MOD-05

  - id: REQ-09
    nome: Robustez
    tipo: simulador
    fonte: "prompt 3.6"
    metrica: >
      Número de exceções e de violações de invariante em 50.000 partidas,
      com bots aleatórios e configurações variadas. O prompt pedia 1.000.000;
      o autor reduziu para 50.000 em 2026-11-10 ("esse número já basta").
    zona: "0 exceções e 0 violações em pelo menos 50.000 partidas"
    criterio: {partidas_minimas: 50000}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-10
    nome: Tempo parado por ciclo
    tipo: modelo
    fonte: "PDF 2.2 p. 34 (Tempo parado)"
    metrica: >
      Por jogador e por ciclo, tempo estimado (MOD-05) em que ele não é o
      jogador da vez, atacante, defensor nem Auditor da disputa.
    zona: "percentil 90 abaixo de 5 minutos"
    criterio: {quantil: 0.9, maximo_min: 5}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-11
    nome: Os dois estilos aparecem
    tipo: comportamento
    fonte: "PDF 2.2 p. 34 (Colocação livre, teto 5, sem troca)"
    metrica: >
      Fração de jogadores com o sistema cheio (no teto) ao fim do Planejamento
      do ciclo 1, numa mesa de bots Heurísticos. Média sobre as partidas, com
      bootstrap sobre as partidas.
    zona: "entre 0.10 e 0.90"
    criterio: {minimo: 0.10, maximo: 0.90}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-12
    nome: O primeiro incidente não decide a partida
    tipo: regra
    fonte: "PDF 2.2 p. 34 (Sistema inicial)"
    metrica: >
      Diferença de taxa de vitória entre os jogadores cujo sistema inicial
      sorteado já cobre a categoria-chave do incidente 1 e os demais, com
      bots idênticos.
    zona: "diferença até 0.10"
    criterio: {diferenca_maxima: 0.10}
    estado: confirmado  # autor, 2026-11-10

  - id: REQ-13
    nome: Incidentes pesam, mas não decidem sozinhos
    tipo: regra
    fonte: "PDF 2.2 p. 34 (Dano de incidente)"
    metrica: >
      Participação dos incidentes no total de fichas movimentadas na partida
      (ganhos mais perdas, de todas as fontes). Conta o incidente inteiro: o
      dano e o ganho do diagnóstico. O Critical Failure não conta como
      incidente. Até 2026-11-14 a medida contava só o dano; a definição mudou
      depois da medição, por decisão do autor (opção C), e o dano sozinho
      continua nos relatórios como descrição.
    zona: "entre 0.20 e 0.60"
    criterio: {minimo: 0.20, maximo: 0.60}
    estado: confirmado  # autor, 2026-11-10; medida redefinida pelo autor em 2026-11-14

  - id: REQ-14
    nome: Sem Hotfix, o placar não dispersa demais
    tipo: regra
    fonte: "PDF 2.2 p. 34 (Sem Hotfix)"
    metrica: >
      Diferença entre o primeiro e o último colocado no placar final, e a
      parte dela que vem de Alertas cobrados na Produção.
    zona: "a definir depois de uma medição descritiva"
    estado: aguardando_decisao

metricas_registradas:
  # Medidas sem critério de aceite. Entram nos relatórios para descrição,
  # para conferir o simulador ou para comparar com dados reais.
  - id: MET-01
    nome: "v1: proporção de partidas desequilibradas"
    fonte: "prompt 3.6; artigo 4.4 (4 de 6 partidas)"
    metrica: >
      Partida desequilibrada: a pontuação do vencedor é pelo menos 1.5 vez a
      média da pontuação dos demais jogadores. Análise de sensibilidade com
      o fator de 1.25 a 2.0. Comparada com 4 de 6 (intervalo de Wilson de
      95%: 0.30 a 0.90), como checagem de plausibilidade. O fator 1.5 vale
      para a v1. Na v2 a métrica é só descrição, porque o placar em fichas não
      está na mesma escala dos pontos da v1; a comparação entre as versões é
      feita pelo REQ-02 (autor, 2026-11-10).
    criterio: {fator: 1.5, sensibilidade: [1.25, 2.0]}
    estado: confirmado  # autor, 2026-11-10; fixado antes do Experimento 1

  - id: MET-02
    nome: "v1: taxa de vitória por política de alvo"
    fonte: "prompt 3.6; artigo 4.4"
    metrica: >
      Taxa de vitória de 1 bot Caçador com a política de alvo p (líder, mais
      fraco ou aleatório) numa mesa em que os outros usam a política q.
      Matriz 3 x 3. A hipótese do artigo é que atacar o mais fraco é a
      melhor resposta. Na v1, líder é quem tem mais cartas no sistema (o
      "mais forte" do artigo); na v2, quem tem mais fichas.
    estado: aguardando_decisao

  - id: MET-03
    nome: Categorias distintas testadas por partida
    fonte: "PDF 2.2 p. 34 (Bug duplicado)"
    metrica: >
      Número de categorias diferentes usadas em testes na Homologação, por
      partida.
    estado: aguardando_decisao

  - id: MET-04
    nome: Incidentes severos por partida
    fonte: "PDF 2.2 p. 34 (Severos)"
    metrica: >
      Média de incidentes severos por partida. Valor esperado no jogo base:
      3 x 3/14 = 0.643. Serve para conferir o sorteio da Linha do Tempo.
    estado: aguardando_decisao

  - id: MET-05
    nome: Acerto e confusão no diagnóstico
    fonte: "PDF 2.2 p. 34 e 35 (Diagnóstico; Registro da partida)"
    metrica: >
      Curva de acerto por ciclo e matriz de confusão do diagnóstico, com as
      escolhas separadas em categoria-chave, secundária e outra. Mesmo
      esquema da Folha de registro, para comparar com partidas reais.
    estado: aguardando_decisao

  - id: MET-06
    nome: Pico de uso de componentes
    fonte: "AMB-17"
    metrica: >
      Máximo de fichas em circulação e de cubos de Alerta em uso ao mesmo
      tempo, por partida, comparado com 135 fichas e 30 cubos.
    estado: aguardando_decisao

  - id: MET-07
    nome: Taxa de vitória por estilo de jogo
    fonte: "autor, 2026-11-10; prompt 3.4"
    metrica: >
      Matriz de taxa de vitória de 1 bot do estilo i (Aleatório, Construtor,
      Caçador, Heurístico) numa mesa em que os outros N-1 são do estilo j, e
      taxa de vitória de cada estilo em mesas mistas. Responde qual é o
      melhor estilo de jogo. Lida junto com REQ-03 e REQ-04, responde se o
      jogo está balanceado: um estilo que vence todos os outros é o melhor
      e, ao mesmo tempo, sinal de desequilíbrio. Matriz com 6 estilos
      (autor, 2026-11-10): Aleatório, Construtor, Heurístico e o Caçador com
      as três políticas de alvo (líder, mais fraco, ao acaso).
    estado: confirmado  # autor, 2026-11-10

  # Profundidade do jogo (Experimento 7, autor em 2026-11-11): só descrição, sem
  # zona, para comparar as regras de testes por ciclo lado a lado. As zonas podem
  # vir depois, com os números na mão.
  - id: MET-08
    nome: Escolhas por partida e escolhas apertadas
    fonte: "autor, 2026-11-11 (profundidade do jogo)"
    metrica: >
      (a) Decisões com 2 ou mais opções legais, em qualquer fase, por jogador
      e por partida. (b) Entre as decisões que o Heurístico avalia por valor
      (compra, colocação e ação na Homologação), a fração em que a segunda
      melhor opção fica a menos do limiar da melhor: escolhas difíceis de
      verdade. O limiar de 0,5 ficha é a mesma escala da temperatura do
      softmax do Heurístico. Intervalo da fração por bootstrap da razão,
      reamostrando as partidas.
    criterio: {limiar_da_escolha_apertada: 0.5}
    estado: confirmado  # autor, 2026-11-11; só descrição, sem zona

  - id: MET-09
    nome: Viradas
    fonte: "autor, 2026-11-11 (profundidade do jogo)"
    metrica: >
      (a) Trocas de líder isolado por partida, conferidas a cada mudança de
      placar: troca é quando o líder isolado passa a ser outro jogador; empate
      no topo não conta como troca. (b) Recuperação: nas partidas com líder
      isolado no fim do ciclo 1 (o ponto de corte do REQ-02), a fração da
      vitória que ficou com outro jogador.
    estado: confirmado  # autor, 2026-11-11; só descrição, sem zona

  - id: MET-10
    nome: Habilidade em degraus
    fonte: "autor, 2026-11-11 (profundidade do jogo)"
    metrica: >
      Taxa de vitória de 1 Heurístico normal (temperatura 0,5, o foco) numa
      mesa com N-1 Heurísticos mais descuidados (temperatura 1, 2 ou 4), com
      rodízio de assentos, dividida por 1/N. Quanto maior, mais jogar bem
      rende. Generaliza o REQ-03, que compara só com o Aleatório.
    estado: confirmado  # autor, 2026-11-11; só descrição, sem zona
