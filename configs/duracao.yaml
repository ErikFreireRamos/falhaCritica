teste_com_defesa: {valor: 60, fonte: "PDF 2.2, p. 34: cada defesa leva até 1 minuto"}
contestacao: {valor: 15, fonte: "provisório, autor em 2026-11-10: acréscimo quando há contestação"}
passar: {valor: 5, fonte: "provisório, autor em 2026-11-10"}
producao: {valor: 180, fonte: "provisório, autor em 2026-11-10: Produção inteira de um ciclo"}
