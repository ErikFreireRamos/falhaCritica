# Não são regras do jogo: são a hipótese do simulador para estimar quanto tempo
# uma partida levaria na mesa. Valores PROVISÓRIOS, aceitos pelo autor em
# 2026-11-10, a calibrar com cronômetro no playtest.

esquema: cf-duracao/1

preparacao: {valor: 180, fonte: "PDF 2.2, p. 4: a preparação leva cerca de 3 minutos"}
