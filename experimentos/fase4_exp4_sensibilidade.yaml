# Fase 4, Experimento 4: sensibilidade (decisões do autor em 2026-11-11).
#
# Varia um parâmetro provisório por vez, a partir da v2.2.1:
# - fichas iniciais: 3, 4, 6 e 7 (atual 5);
# - dano de incidente sem cobertura: 1 e 3 (atual 2); item de Alerta: 0 e 2 (atual 1);
# - tempos do modelo de duração (MOD-05): todos -25% e +25%. Os tempos não mudam o jogo,
#   só a medida de duração e de tempo parado (REQ-08 e REQ-10).
#
# Mesas de Heurísticos sorteadas da mistura do equilíbrio do blefe (pesos do Experimento 5b),
# conhecimento iniciante e experiente, 2.000 partidas por cenário. Os critérios foram fixados
# em configs/requisitos.yaml antes da execução.

esquema: cf-experimento/1
nome: fase4_exp4_sensibilidade
descricao: >
  Sensibilidade na v2.2.1: fichas iniciais, dano de incidente e tempos do modelo de duração,
  um de cada vez, com mesas de 4 e de 5 e conhecimento iniciante e experiente.
semente_mestre: 20261119
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

