# Fase 4: o melhor estilo de jogo na v2.2.1 (decisões do autor em 2026-11-10).
#
# Pergunta do autor: qual é o melhor estilo de jogo, e o jogo está balanceado?
# - MET-07: matriz 6 x 6 de estilos. Em cada célula, 1 bot do estilo da linha (o foco)
#   joga contra N-1 bots do estilo da coluna, com rodízio de assentos: 2.000 partidas por
#   célula (500 por rotação com 4 jogadores, 400 com 5). A diagonal não roda: na mesa de
#   bots iguais o foco vence exatamente 1/N.
# - REQ-04: nenhum estilo é a melhor resposta contra todas as mesas.
# - REQ-03: o Heurístico contra N-1 Aleatórios vence acima de 1,5/N.
# - REQ-11 e REQ-01: mesas só de Heurísticos.
#
# Todos com conhecimento experiente, blefe moderado e contestação pelo limiar, como nas
# Fases 2 e 3. Os critérios foram fixados em configs/requisitos.yaml antes da execução.

esquema: cf-experimento/1
nome: fase4_melhor_estilo
descricao: >
  Melhor estilo de jogo na v2.2.1, com mesas de 4 e de 5. Matriz 6 x 6 de estilos (um
  bot foco contra N-1 bots de outro estilo, com rodízio de assentos), análise de
  estilo dominante e dinâmica do replicador; Heurístico contra Aleatórios; mesas só de
  Heurísticos para os dois estilos de sistema e a equidade de assento.
semente_mestre: 20261114
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

