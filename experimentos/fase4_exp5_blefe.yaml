# Fase 4, Experimento 5: equilíbrio do blefe (decisões do autor em 2026-11-10).
#
# Os 9 perfis puros de blefe (blefar nunca, metade das vezes ou sempre; contestar nunca,
# sempre ou pelo limiar de R-7.3.5), todos com o estilo Heurístico, que foi o melhor estilo.
# - REQ-04: matriz 9 x 9. Em cada célula, 1 Heurístico com o perfil da linha (o foco) joga
#   contra N-1 Heurísticos com o perfil da coluna, com rodízio de assentos: 1.000 partidas
#   por célula (250 por rotação com 4 jogadores, 200 com 5).
# - REQ-05: as 9 mesas de perfis iguais (a diagonal), 2.000 partidas cada. O veredito vale
#   no equilíbrio da dinâmica do replicador; as 9 populações são só descrição.
#
# Todos com conhecimento experiente. Os critérios foram fixados em configs/requisitos.yaml
# antes da execução.

esquema: cf-experimento/1
nome: fase4_exp5_blefe
descricao: >
  Equilíbrio do blefe na v2.2.1, com mesas de 4 e de 5. Matriz 9 x 9 entre os perfis puros
  de blefe (um Heurístico foco contra N-1 Heurísticos de outro perfil, com rodízio de
  assentos), análise de perfil dominante e dinâmica do replicador; mesas de perfis iguais
  para os blefes bem-sucedidos no equilíbrio.
semente_mestre: 20261115
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

