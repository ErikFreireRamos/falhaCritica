# Fase 4, Experimento 6: variantes do playtest (decisões do autor em 2026-11-10).
#
# Cada variante sozinha, a partir da v2.2.1, cruzada com conhecimento iniciante e
# experiente e com mesas de 4 e de 5. Mesas só de Heurísticos (o equilíbrio dos estilos).
# O comportamento de blefe é a mistura do equilíbrio do Experimento 5 (autor, 2026-11-10):
# cada assento é sorteado da mistura, com os mesmos pesos do Experimento 5b. 2.000 partidas
# por cenário.
#
# Mecânica das variantes (docs/especificacao_v2_2.md, seção Variantes de playtest):
# VAR-01 punição do blefe descoberto (0 ou 2 fichas); VAR-02 explicação que não confere
# custa mais 1 ficha ao banco; VAR-03 Auditor externo que acerta 95 de 100; VAR-04 alvo
# pelo vizinho designado (esquerda, direita, esquerda); VAR-05 no máximo 2 testes recebidos
# por ciclo; VAR-06 palpite da plateia (AMB-30, AMB-31); VAR-07 2 compras; VAR-09 módulo.
#
# Os critérios foram fixados em configs/requisitos.yaml antes da execução.

esquema: cf-experimento/1
nome: fase4_exp6_variantes
descricao: >
  Variantes do playtest, uma de cada vez a partir da v2.2.1, com Heurísticos de
  conhecimento iniciante e experiente e mesas de 4 e de 5: duração, distribuição de
  ataques, fichas, tempo parado, os dois estilos, o primeiro incidente e o peso dos
  incidentes.
semente_mestre: 20261116
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

