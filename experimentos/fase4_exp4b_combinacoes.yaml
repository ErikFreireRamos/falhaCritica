# Fase 4, Experimento 4b: combinações de fichas iniciais e dano de incidente (autor, 2026-11-11).
#
# A sensibilidade (Experimento 4) mostrou que o REQ-13 com experientes só passa com dano 3
# sem cobertura, e que aí o REQ-07 falha. Este experimento cruza fichas iniciais (5, 6) com
# dano sem cobertura (2, 3) para ver se alguma combinação satisfaz os dois. Não cria v2.3:
# é uma proposta testada no simulador, para o autor levar ao playtest se quiser.
#
# Mesas de Heurísticos sorteadas da mistura do equilíbrio do blefe, conhecimento iniciante e
# experiente, 2.000 partidas por cenário. Critérios fixados em configs/requisitos.yaml.

esquema: cf-experimento/1
nome: fase4_exp4b_combinacoes
descricao: >
  Combinações de fichas iniciais (5 e 6) e dano de incidente sem cobertura (2 e 3) na
  v2.2.1, com mesas de 4 e de 5 e conhecimento iniciante e experiente.
semente_mestre: 20261120
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

