  # ---------------------------------------------------------------- 4 jogadores, iniciante
  - nome: n4_iniciante_fichas_5_dano_2
    regras: configs/regras_v2_2_1.yaml
    jogadores: 4
    partidas: 2000
    mudancas: {fichas.iniciais: 5, dano.incidente.sem_cobertura: 2}
    requisitos: [REQ-06, REQ-07, REQ-08, REQ-10, REQ-11, REQ-12, REQ-13]
    pesos: [325, 501, 133, 41]
    bots:
      - {tipo: heuristico, rotulo: blefa_nunca_contesta_nunca, parametros: {conhecimento: iniciante, blefe: nunca, contestacao: nunca}}
