# Experimento 7 (Fase 4): profundidade do jogo. Decisões do autor em 2026-11-11.
#
# Compara a regra atual (testes sem limite por ciclo) com três alternativas:
# - VAR-11 com 1 teste por ciclo (a regra da 2.1, já medida na ablação);
# - VAR-11 com 2 testes por ciclo (meio-termo nunca medido);
# - VAR-12, custo do teste: sem limite, mas do 2º teste do ciclo em diante cada teste custa
#   1 ficha ao atacante, paga ao banco; sem ficha para pagar, não testa (AMB-32).
# O Heurístico conhece o limite e o custo: as cartas de ataque além do limite valem com o
# desconto do futuro, e o custo entra no valor do teste. Sem limite nem custo, joga como antes.
#
# Medidas de profundidade, só descrição (MET-08, MET-09, MET-10), mais os REQ do Experimento 3.
# - Principal: mesas de Heurísticos sorteadas da mistura do equilíbrio do blefe (pesos do
#   Experimento 5b), iniciante e experiente, 4 e 5 jogadores, 2.000 partidas por cenário.
# - Degraus (MET-10): 1 Heurístico normal (temperatura 0,5, o foco) contra N-1 Heurísticos com
#   temperatura 1, 2 ou 4; experiente, blefe metade, contestação pelo limiar; rodízio de assentos,
#   2.000 partidas por cenário (500 por rotação com 4 jogadores, 400 com 5).

esquema: cf-experimento/1
nome: fase4_exp7_profundidade
descricao: >
  Profundidade do jogo na v2.2.1: testes sem limite por ciclo, 1 e 2 testes por ciclo (VAR-11)
  e custo do teste a partir do 2º teste do ciclo (VAR-12), com escolhas apertadas, viradas e
  habilidade em degraus (MET-08 a MET-10).
