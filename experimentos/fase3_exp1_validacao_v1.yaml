# Fase 3, Experimento 1: validação da v1 (decisões do autor em 2026-11-10).
#
# A v1 só é observada, nunca ajustada. Perguntas:
# 1. O simulador reproduz o desequilíbrio relatado no artigo (4 de 6 partidas)? (MET-01)
# 2. Atacar o mais fraco é a melhor política de alvo? (MET-02)
#
# Mesas de 6, como os grupos do artigo (AMB-27). Todos com conhecimento experiente,
# blefe moderado e contestação pelo limiar. Critério de desequilíbrio fixado antes
# da execução: vencedor com pelo menos 1,5 vez a média dos demais.

esquema: cf-experimento/1
nome: fase3_exp1_validacao_v1
descricao: >
  Validação da v1 com mesas de 6. Matriz 3 x 3 de política de alvo (um Caçador
  foco contra cinco Caçadores com outra política, com rodízio de assentos) e
  proporção de partidas desequilibradas em populações de bots idênticos e numa
  mesa mista.
semente_mestre: 20261112
duracao: configs/duracao.yaml
registros_completos_um_a_cada: 1000

cenarios:
