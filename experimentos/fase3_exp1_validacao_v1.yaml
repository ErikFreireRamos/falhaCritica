  - nome: alvo_lider_contra_lider
    regras: configs/regras_v1.yaml
    jogadores: 6
    partidas: 1000
    rodizio: true
    celula: [lider, lider]
    bots:
      - {tipo: cacador, rotulo: foco, parametros: {conhecimento: experiente, blefe: metade, contestacao: limiar, alvo: lider}}
      - {tipo: cacador, rotulo: outros, parametros: {conhecimento: experiente, blefe: metade, contestacao: limiar, alvo: lider}}
      - {tipo: cacador, rotulo: outros, parametros: {conhecimento: experiente, blefe: metade, contestacao: limiar, alvo: lider}}
